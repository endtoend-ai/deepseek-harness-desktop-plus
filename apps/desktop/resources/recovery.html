<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'none'; connect-src 'none'">
  <title>DeepSeek Harness · Plugin Recovery</title>
  <link rel="stylesheet" href="./recovery.css">
</head>
<body>
  <main class="card" aria-labelledby="title">
    <div class="mark" aria-hidden="true">↺</div>
    <p class="eyebrow">DeepSeek Harness</p>
    <h1 id="title">The plugin environment needs recovery</h1>
    <p id="summary" class="summary">Reading the recovery state of the last plugin operation…</p>
    <dl class="details">
      <div><dt>Operation</dt><dd id="operation">—</dd></div>
      <div><dt>Recovery attempts</dt><dd id="attempt">—</dd></div>
      <div><dt>Failure reason</dt><dd id="reason">—</dd></div>
    </dl>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="retry" type="button" disabled>Recover the previous environment</button>
      <button id="export" class="secondary" type="button" disabled>Export diagnostics</button>
    </div>
    <p class="footnote">Ordinary desktop features stay off until the previous Host, client, and Skill inventory verify again.</p>
  </main>
  <script src="./recovery.js"></script>
</body>
</html>
